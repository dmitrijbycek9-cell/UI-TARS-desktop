name: Deploy diet-app to GitHub Pages

# Baut die PWA in diet-app/ und veröffentlicht sie auf GitHub Pages.
on:
  push:
    branches: [claude/diet-tracking-app-6kID9]
    paths:
      - 'diet-app/**'
      - '.github/workflows/deploy-diet-app.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: diet-app
        run: npm ci

      - name: Build
        working-directory: diet-app
        run: npm run build

      # Aktiviert GitHub Pages bei Bedarf automatisch (Quelle: GitHub Actions)
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: diet-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
